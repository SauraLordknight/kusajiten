<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340"><title>大当たりとモードの流れの説明図</title><rect width="650" height="340" rx="24" fill="#102d3e"/><g font-family="sans-serif" text-anchor="middle"><rect x="170" y="20" width="310" height="65" rx="16" fill="#ffe4a0"/><text x="325" y="60" font-size="24" fill="#352806" font-weight="bold">大当たり！ 発射を続ける</text><path d="M325 90V122M317 112L325 122 333 112" stroke="#abe9ff" stroke-width="4" fill="none"/><rect x="170" y="130" width="310" height="58" rx="16" fill="#d9f3ff"/><text x="325" y="167" font-size="21" fill="#143d56">1ラウンド 目安は約2分</text><text x="325" y="223" font-size="19" fill="#fff">継続すれば、次のラウンドへ</text><rect x="25" y="251" width="285" height="65" rx="15" fill="#d8efe0"/><rect x="340" y="251" width="285" height="65" rx="15" fill="#dce8ff"/><text x="168" y="290" font-size="21" fill="#163b29">修復：40回の抽選</text><text x="482" y="290" font-size="21" fill="#223759">解放：60回の抽選</text></g></svg>
