<!doctype html><html lang="ja"><meta charset="utf-8"><title>ガラスの少女・役物素材</title>
<style>body{background:#f6f5f2;color:#183c50;font:15px sans-serif;margin:24px}main{max-width:1100px;margin:auto}.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}figure{margin:0;background:#fff;padding:10px;text-align:center}img{width:100%;height:150px;object-fit:contain}canvas{display:block;max-width:440px;width:100%;background:#fff;margin:20px auto}button{padding:10px;margin:4px}@media(max-width:600px){.parts{grid-template-columns:repeat(2,1fr)}}</style>
<main><h1>黒い骨格・青い可動部・透明な通路</h1><p>7つの透過パーツを、現在の物理座標へ配置しています。以下は見た目の確認専用で、遊技データには影響しません。</p>
<div class="parts"><figure><img src="gate.png"><figcaption>入口・出口／共通の模様</figcaption></figure><figure><img src="blade.png"><figcaption>花びら・回転羽根</figcaption></figure><figure><img src="hub.png"><figcaption>黒い中心軸</figcaption></figure><figure><img src="tunnel.png"><figcaption>透明なトンネル</figcaption></figure><figure><img src="pocket.png"><figcaption>保持・入賞の器</figcaption></figure><figure><img src="attacker-frame.png"><figcaption>アタッカーの枠</figcaption></figure><figure><img src="attacker-door.png"><figcaption>独立した開閉扉</figcaption></figure></div>
<button data-mode="idle">通常</button><button data-mode="open">開放</button><button data-mode="held">保持</button><button data-mode="warp">ワープ</button><button data-mode="rotor">回転確認</button><button id="diagnostic">判定の線を切り替え</button><canvas id="board" width="880" height="1140"></canvas></main>
<script src="../../../scripts/debug-pachi-physics.js"></script><script src="../../../scripts/glass-mechanism-art.js"></script><script>
let mode='idle',diagnostic=false,started=performance.now();const p=DebugPachiPhysics,c=document.querySelector('#board'),ctx=c.getContext('2d');
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;started=performance.now();});document.querySelector('#diagnostic').onclick=()=>diagnostic=!diagnostic;
function frame(now){p.reset();const t=(now-started)/1000;p.state.time=t;const balls=[];
if(mode==='open'){p.state.wingProgress=1;p.state.jackpot=true;}if(mode==='held'){p.state.held={x:81,y:380};p.state.holdUntil=t+1.4;balls.push(p.state.held);}if(mode==='warp'){p.state.exitFlash=t+.2;balls.push({phase:'warp'});}if(mode==='rotor'){p.state.rotorAngle=t*2;p.state.rotorOmega=2;}
ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.scale(2,2);for(const peg of p.pegs){ctx.fillStyle='#738b99';ctx.beginPath();ctx.arc(peg.x,peg.y,peg.r,0,Math.PI*2);ctx.fill();}GlassMechanismArt.draw(ctx,p,{diagnostic,balls});if(mode==='held'){ctx.fillStyle='#abc0ce';ctx.beginPath();ctx.arc(81,380,6,0,Math.PI*2);ctx.fill();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
